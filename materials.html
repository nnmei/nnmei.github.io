<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
    <h5>กดแป้นพิมพ์เพื่อใช้คำสั่ง</h5>
    <p>click เพื่อเลือกตำแหน่งของแสง</p>
    <p>กดปุ่มลูกศรเพื่อขยับแสงไปมุมต่างๆ</p>
<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        

        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);


        
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/teufelsberg_lookout_4k.exr';
        //const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/ferndale_studio_12_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });




/* Auto-exported from Blender */
const vertices = [
            0.0
];

const uvs = [
            0.0
];


        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geom.computeVertexNormals();

        const tex = new THREE.TextureLoader().load('https://sibsansuk.github.io/5241_Capheny2.png', t => {
        });
        const mat = new THREE.MeshStandardMaterial({
            map: tex
        });

        const mesh = new THREE.Mesh(geom, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        //scene.add(mesh);


        //ใส่พื้น
        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg', t => {
        });
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            doubleSided: true
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        
        scene.add(plane);

        //basicMaterial
        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const basicMaterial = new THREE.MeshBasicMaterial({color: 0x00ff00});
        const basicMesh = new THREE.Mesh(sphereGeometry,basicMaterial);
        basicMesh.castShadow = true;
        basicMesh.position.set(2, 1, -1);
        //scene.add(basicMesh);

        //lambertMaterial
        const lambertsphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const lambertMaterial = new THREE.MeshLambertMaterial({color: 0xff0000});
        const lambertMesh = new THREE.Mesh(lambertsphereGeometry,lambertMaterial);
        lambertMesh.castShadow = true;
        lambertMesh.position.set(0, 1, -1);
        //scene.add(lambertMesh);

        //phong
        const phongsphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const phongtMaterial = new THREE.MeshPhongMaterial(
            {
                color: 0x0000ff,
                //specular: 0xffffff,
                shininess: 80
            });
        const phongMesh = new THREE.Mesh(phongsphereGeometry,phongtMaterial);
        phongMesh.castShadow = true;
        phongMesh.position.set(-2, 1, -1);
        //scene.add(phongMesh);

        //standard (PBR)
        const standardsphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const standardMaterial = new THREE.MeshStandardMaterial(
            {
                color: 0xffcc00,
                metalness: 0.8,
                roughness: 0.2
            });
        const standardMesh = new THREE.Mesh(standardsphereGeometry,standardMaterial);
        standardMesh.castShadow = true;
        standardMesh.position.set(0, 1, 1);
        //scene.add(standardMesh);

        //load glb และใช้ pbr material
        const loader = new THREE.GLTFLoader();
        loader.load('https://nnmei.github.io/teapot.glb', (gltf) => {
            const model = gltf.scene;
            model.scale.set(10, 10, 10);
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            model.position.set(0, 0, 0);
            scene.add(model);
        });

        window.addEventListener('click', (event) => {
            const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            const mouseY = -(event.clientY / window.innerHeight) * 2 + 1;

            directionalLight.position.x = mouseX * 10;
            directionalLight.position.z = -mouseY * 10;
        });

        window.addEventListener('keydown', (event) => {
            const step = 0.5; //

            switch (event.key) {
                case 'ArrowLeft':
                    directionalLight.position.x -= step;
                    break;
                case 'ArrowRight':
                    directionalLight.position.x += step;
                    break;
                case 'ArrowUp':
                    if (event.shiftKey) {
                        directionalLight.position.y += step;
                    } else {
                        directionalLight.position.z -= step;
                    }
                    break;
                case 'ArrowDown':
                    if (event.shiftKey) {
                        directionalLight.position.y -= step;
                    } else {
                        directionalLight.position.z += step;
                    }
                 break;
            }
        });
        
        function animate(t) {
            //mesh.rotation.y = Math.sin(t * 0.001);
            //renderer.render(scene, camera);
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera); 
        }
        animate();

        window.addEventListener('keydown', (event) => {

        });

    </script>
</body>

</html>
