<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Room Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
    #menu {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 8px; z-index: 10;
      flex-wrap: wrap; justify-content: center; width: 90%; max-width: 600px;
    }
    button {
      padding: 8px 14px; border-radius: 8px; border: none;
      background: white; font-weight: bold; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: 0.2s;
      font-size: 13px;
    }
    button:hover { background: #ffaa00; color: white; }
    
    #cam-info {
      position: absolute; top: 15px; left: 15px;
      background: rgba(0, 0, 0, 0.75); color: #00ffcc;
      padding: 10px 14px; border-radius: 6px; font-family: monospace;
      font-size: 12px; pointer-events: none; z-index: 20;
      line-height: 1.5;
    }
  </style>

  <!-- Three.js + Addons + GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="cam-info">กำลังโหลดพิกัดกล้อง...</div>

  <div id="menu">
    <button onclick="setView('overview')">ภาพรวม</button>
    <button onclick="setView('bakery')">หน้าเบเกอรี่</button>
    <button onclick="setView('piano')">หน้าเปียโน</button>
    <button onclick="setView('microwave')">หน้าไมโครเวฟ</button>
    <button onclick="setView('name')">หน้าชื่อ</button>
    <button onclick="setView('photo')">หน้ารูปภาพของฉัน</button>
    <button onclick="window.location.href='https://nnmei.github.io/index.html'">Portfolio</button>
  </div>

  <script>
    // ==========================================
    // ⚙️ ส่วนที่ 1: ตั้งค่าพิกัด
    // ==========================================
    const SUN_CONFIG = { x: .9, y: 5.6, z: -4.3, color: 0xffffff, intensity: 1.5 };
    const MICROWAVE_LIGHT_CONFIG = { x: 2.4, y: 0.3, z: -2.0, color: 0xff7700, intensity: 3.0, distance: 5.0 };

    const CAMERA_VIEWS = {
      overview: { camera: { x: -17.79, y: 16.18, z: 14.34 }, target: { x: -0.39, y: 0.26, z: 0.18 } },
      bakery:   { camera: { x: -10.61, y: 4.33, z: -0.05 }, target: { x: -0.45, y: 0.12, z: 0.05 } },
      piano:    { camera: { x: -1.66, y: 5.31, z: 2.07 }, target: { x: 2.58, y: 1.14, z: 1.41 } },
      microwave:{ camera: { x: 2.4, y: 1.0, z: -0.5 }, target: { x: 2.4, y: 0.3, z: -2.5 } },
      name:     { camera: { x: -0.4, y: 5.22, z: 2.21 }, target: { x: -1, y: 3.4, z: -3.3 } },
      photo:    { camera: { x: 0.99, y: 2.11, z: 2.41 }, target: { x: 2.79, y: 1.82, z: 2.53 } }
    };

    // ==========================================
    // 🎬 ส่วนที่ 2: เริ่มต้นฉาก THREE.JS
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x333333);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const clock = new THREE.Clock();

    // ระบบแสง
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sunLight = new THREE.DirectionalLight(SUN_CONFIG.color, SUN_CONFIG.intensity);
    sunLight.position.set(SUN_CONFIG.x, SUN_CONFIG.y, SUN_CONFIG.z);
    scene.add(sunLight);

    const ovenLight = new THREE.PointLight(MICROWAVE_LIGHT_CONFIG.color, MICROWAVE_LIGHT_CONFIG.intensity, MICROWAVE_LIGHT_CONFIG.distance);
    ovenLight.position.set(MICROWAVE_LIGHT_CONFIG.x, MICROWAVE_LIGHT_CONFIG.y, MICROWAVE_LIGHT_CONFIG.z);
    scene.add(ovenLight);

    // ==========================================
    // 🪟 ผ้าม่านหน้าต่าง (ปรับตำแหน่งและขนาดแล้ว)
    // ==========================================
    const curtainWidth = 1.8;   // 👈 [1] ปรับความกว้างม่านตรงนี้
    const curtainHeight = 1.8;  // 👈 [2] ปรับความยาว/สูงม่านตรงนี้

    const curtainMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      side: THREE.DoubleSide,
      transparent: true,
      vertexShader: `
        uniform float uTime;
        void main() {
          vec3 pos = position;
          float w = clamp((0.65 - pos.y) / 1.3, 0.0, 1.0);
          float windPush = 0.45 * w; // แรงลมดันม่านออกมาข้างหน้า
          float wave = sin(pos.x * 4.0 + uTime * 3.5) * 0.06 * w; // คลื่นลมสะบัด
          
          pos.z += windPush + wave;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        void main() { gl_FragColor = vec4(1.0, 0.75, 0.35, 0.45); }
      `
    });

    const windowCurtain = new THREE.Mesh(
      new THREE.PlaneGeometry(curtainWidth, curtainHeight, 20, 20), 
      curtainMat
    );

    // 👈 [3] ปรับตำแหน่งม่านตรงบรรทัดนี้: (ซ้าย-ขวาผนัง, สูง-ต่ำ, หน้า-หลัง)
    windowCurtain.position.set(3.3, 3.2, 1.0);

    windowCurtain.rotation.y = -Math.PI / 2;
    scene.add(windowCurtain);

    // ==========================================
    // 📦 ส่วนที่ 3: โหลดไฟล์โมเดล GLB
    // ==========================================
    const loader = new THREE.GLTFLoader();
    const modelUrl = 'https://nnmei.github.io/project14.glb';

    loader.load(modelUrl, (gltf) => {
      scene.add(gltf.scene);
      setView('overview', false);
    });

    // ==========================================
    // 🎯 ส่วนที่ 4: ฟังก์ชันสลับมุมกล้อง
    // ==========================================
    function setView(name, animated = true) {
      const view = CAMERA_VIEWS[name];
      if (!view) return;

      gsap.killTweensOf(camera.position);
      gsap.killTweensOf(controls.target);

      if (animated) {
        gsap.to(camera.position, {
          x: view.camera.x, y: view.camera.y, z: view.camera.z,
          duration: 1.2, ease: 'power2.out'
        });
        gsap.to(controls.target, {
          x: view.target.x, y: view.target.y, z: view.target.z,
          duration: 1.2, ease: 'power2.out',
          onUpdate: () => controls.update()
        });
      } else {
        camera.position.set(view.camera.x, view.camera.y, view.camera.z);
        controls.target.set(view.target.x, view.target.y, view.target.z);
        controls.update();
      }
    }

    // ==========================================
    // 🖱️ ส่วนที่ 5: 3D Interaction
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let startX = 0, startY = 0;

    window.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('#menu') || (e.target.tagName && e.target.tagName.toLowerCase() === 'button')) return;
      if (Math.abs(e.clientX - startX) > 7 || Math.abs(e.clientY - startY) > 7) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        const hit = intersects.find(item => item.object.type === 'Mesh');
        if (!hit) { setView('overview'); return; }

        const p = hit.point;
        if (p.y > 2.0 && p.z < -1.5) setView('name');
        else if (p.x < -0.3) setView('bakery');
        else if (p.x > 0.6 && p.z < 0.0) setView('microwave');
        else if (p.x > 0.6 && p.z >= 0.0) setView('piano');
        else setView('overview');
      } else {
        setView('overview');
      }
    });

    // ==========================================
    // 🔍 ส่วนที่ 6: พิมพ์พิกัดกล้อง
    // ==========================================
    const infoBox = document.getElementById('cam-info');

    function logCameraPosition() {
      const cam = { x: parseFloat(camera.position.x.toFixed(2)), y: parseFloat(camera.position.y.toFixed(2)), z: parseFloat(camera.position.z.toFixed(2)) };
      const tgt = { x: parseFloat(controls.target.x.toFixed(2)), y: parseFloat(controls.target.y.toFixed(2)), z: parseFloat(controls.target.z.toFixed(2)) };

      infoBox.innerHTML = `
        📷 Camera: { x: ${cam.x}, y: ${cam.y}, z: ${cam.z} }<br>
        🎯 Target: { x: ${tgt.x}, y: ${tgt.y}, z: ${tgt.z} }
      `;
      console.log(`camera: { x: ${cam.x}, y: ${cam.y}, z: ${cam.z} }, target: { x: ${tgt.x}, y: ${tgt.y}, z: ${tgt.z} }`);
    }

    controls.addEventListener('end', logCameraPosition);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'c' || e.key === 'C') logCameraPosition();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 🎬 ส่วนที่ 7: Animate Loop
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      curtainMat.uniforms.uTime.value = clock.getElapsedTime();
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
